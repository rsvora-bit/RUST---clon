name: Apply and validate Tideland v0.7.6

on:
  push:
    branches:
      - fix/v076-loot-tree-interactions
    paths:
      - scripts/apply-v076.py
      - .github/workflows/v076-patch.yml

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/v076-loot-tree-interactions
          fetch-depth: 0
      - name: Apply patch
        run: python3 scripts/apply-v076.py
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Verify v0.7.6 markers
        run: |
          grep -q "GAME_VERSION='0.7.6'" src/config/version.ts
          grep -q "GAME_BUILD='EA-07.6'" src/config/version.ts
          grep -q "collapseLoot" src/survival/StationRenderer.ts
          grep -q "resource-health-track" src/ui/UI.ts
          grep -q "if(pickup)this.gather" src/app/GameApp.ts
          grep -q "hitRotation" src/rendering/environment.ts
      - name: Commit validated patch
        run: |
          rm -f scripts/apply-v076.py .github/workflows/v076-patch.yml
          git config user.name "Roman Svora"
          git config user.email "roman.svora.ml@gmail.com"
          git add -A
          git commit -m "Tideland v0.7.6: loot breakup and harvesting fixes"
          git push origin HEAD:fix/v076-loot-tree-interactions
