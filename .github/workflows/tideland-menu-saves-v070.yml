name: Validate Tideland v0.7.0 Menu & Saves

on:
  push:
    branches: [feature/menu-saves-settings-v070]
    paths:
      - 'scripts/menu-saves-v070-finalize.py'
      - '.github/workflows/tideland-menu-saves-v070.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: feature/menu-saves-settings-v070
          fetch-depth: 0

      - name: Apply menu, save and settings overhaul
        run: python3 scripts/menu-saves-v070-finalize.py

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Verify release markers
        run: |
          grep -q "GAME_VERSION='0.7.0'" src/config/version.ts
          grep -q "GAME_BUILD='EA-07'" src/config/version.ts
          grep -q '"version": "0.7.0"' package.json
          grep -q "SLOT_COUNT: 5" src/config/gameplay.ts
          grep -q "listSaveSlots" src/save/storage.ts
          grep -q "hudScale" src/core/types.ts
          grep -q "save-browser" src/ui/UI.ts
          grep -q "menu-classic-v7" src/ui/style.css

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser smoke menu, saves and settings
        run: |
          npm run dev -- --port 4175 > /tmp/tideland-v070-vite.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in {1..40}; do curl -fsS http://127.0.0.1:4175/ >/dev/null && break; sleep 0.5; done
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true,args:['--use-angle=swiftshader','--enable-unsafe-swiftshader']});
          const page=await browser.newPage({viewport:{width:1440,height:900}});
          page.setDefaultTimeout(120000);
          const errors=[];page.on('pageerror',e=>errors.push(String(e)));page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
          await page.goto('http://127.0.0.1:4175/',{waitUntil:'networkidle',timeout:120000});
          await page.waitForSelector('.loading-screen',{state:'hidden',timeout:180000});
          await page.waitForSelector('.menu-classic-v7',{state:'visible',timeout:120000});
          await page.click('[data-action="new"]');
          await page.waitForSelector('.save-browser:not([hidden])');
          if(await page.locator('.save-slot-card').count()!==5) throw new Error('Expected five save slots');
          await page.click('[data-action="saveBrowserClose"]');
          await page.click('[data-action="settings"]');
          await page.waitForSelector('[data-view="settings"]',{state:'visible'});
          const hud=page.locator('input[data-setting="hudScale"]');if(await hud.count()!==1)throw new Error('HUD scale setting missing');
          await hud.evaluate(el=>{el.value='1.3';el.dispatchEvent(new Event('input',{bubbles:true}));});
          const crosshair=page.locator('input[data-setting="crosshairScale"]');if(await crosshair.count()!==1)throw new Error('Crosshair size setting missing');
          if(errors.length)throw new Error(errors.join('\n'));
          await browser.close();
          NODE

      - name: Commit validated release
        run: |
          rm scripts/menu-saves-v070-finalize.py .github/workflows/tideland-menu-saves-v070.yml
          git config user.name 'Roman Svora'
          git config user.email 'roman.svora.ml@gmail.com'
          git add -A
          git commit -m 'Tideland v0.7.0: classic menu and multi-save overhaul'
          git push origin HEAD:feature/menu-saves-settings-v070
