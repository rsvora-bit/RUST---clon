name: Validate Tideland v0.7.1 Fixes

on:
  push:
    branches: [fix/v071-ui-settings-vegetation]
    paths:
      - 'scripts/fix-v071.py'
      - '.github/workflows/tideland-v071-fixes.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: fix/v071-ui-settings-vegetation
          fetch-depth: 0

      - name: Apply v0.7.1 patch
        run: python3 scripts/fix-v071.py

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Verify patch markers
        run: |
          grep -q "GAME_VERSION='0.7.1'" src/config/version.ts
          grep -q "GAME_BUILD='EA-07.1'" src/config/version.ts
          grep -q "setFoliageDensity" src/rendering/environment.ts
          grep -q "setShadowSettings" src/world/atmosphere.ts
          grep -q "setUserSettings" src/rendering/WorldPostFX.ts
          grep -q "pause-v4-panel" src/ui/UI.ts
          grep -q "foliageDensity" src/ui/UI.ts
          grep -q "shadowDistance" src/ui/UI.ts
          grep -q "showFps','showTutorialHints" src/ui/UI.ts
          ! grep -q "vGrassFade" src/rendering/environment.ts

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser smoke — toggles, delete slot and expanded graphics
        run: |
          npm run dev -- --port 4176 > /tmp/tideland-v071-vite.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in {1..60}; do curl -fsS http://127.0.0.1:4176/ >/dev/null && break; sleep 0.5; done
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true,args:['--use-angle=swiftshader','--enable-unsafe-swiftshader']});
          const context=await browser.newContext({viewport:{width:1440,height:900}});
          await context.addInitScript(() => {
            const state={version:1,worldGeneration:2,seed:731942,elapsed:75,timeOfDay:9.4,nextId:1,player:{position:{x:0,y:2,z:0},yaw:0,pitch:0,stats:{health:100,hunger:86,thirst:78,stamina:100}},inventory:Array(30).fill(null),activeSlot:0,structures:[],nodeChanges:{},drops:[],craftQueue:[]};
            localStorage.setItem('tideland:save:v1:slot:1',JSON.stringify({savedAt:Date.now(),state}));
          });
          const page=await context.newPage();
          const errors=[];page.on('pageerror',e=>errors.push(String(e)));page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
          await page.goto('http://127.0.0.1:4176/',{waitUntil:'domcontentloaded',timeout:120000});
          await page.waitForSelector('.menu-classic-v7',{state:'attached',timeout:30000});
          if(await page.locator('.pause-v4-panel').count()!==1)throw new Error('New pause menu missing');
          const click=async selector=>{const loc=page.locator(selector).first();if(await loc.count()!==1)throw new Error(`Missing ${selector}`);await loc.evaluate(el=>el.click());};
          await click('[data-action="settings"]');
          if(await page.locator('[data-view="settings"]').count()!==1)throw new Error('Settings view missing');
          const fpsOn=page.locator('[data-toggle="showFps"][data-value="true"]');await fpsOn.evaluate(el=>el.click());if(!(await fpsOn.evaluate(el=>el.classList.contains('active'))))throw new Error('FPS toggle did not activate');
          const tipsOff=page.locator('[data-toggle="showTutorialHints"][data-value="false"]');await tipsOff.evaluate(el=>el.click());if(!(await tipsOff.evaluate(el=>el.classList.contains('active'))))throw new Error('Tutorial toggle did not activate');
          await click('[data-settings-tab="graphics"]');
          if(await page.locator('input[data-setting="foliageDensity"]').count()!==1)throw new Error('Foliage density missing');
          if(await page.locator('input[data-setting="shadowDistance"]').count()!==1)throw new Error('Shadow distance missing');
          if(await page.locator('[data-shadow-quality]').count()!==3)throw new Error('Shadow quality buttons missing');
          if(await page.locator('[data-toggle="ambientOcclusion"]').count()!==2)throw new Error('AO toggle missing');
          await click('[data-settings-tab="gameplay"]');
          await click('[data-action="manageSaves"]');
          const browserPanel=page.locator('.save-browser');if(await browserPanel.getAttribute('hidden')!==null)throw new Error('Save browser did not open');
          const deleteButton=page.locator('[data-save-action="delete"][data-save-slot="1"]');if(await deleteButton.count()!==1)throw new Error('Slot 1 delete button missing');
          await deleteButton.evaluate(el=>el.click());
          const confirm=page.locator('.delete-slot-confirm');if(await confirm.getAttribute('hidden')!==null)throw new Error('Delete confirmation did not open');
          await page.locator('[data-action="deleteSlotConfirm"]').evaluate(el=>el.click());
          await page.waitForFunction(()=>localStorage.getItem('tideland:save:v1:slot:1')===null,{timeout:5000});
          const card=page.locator('.save-slot-card').first();if(!(await card.evaluate(el=>el.classList.contains('empty'))))throw new Error('Save browser did not refresh after deletion');
          if(errors.length)throw new Error(errors.join('\n'));
          await browser.close();
          NODE

      - name: Commit validated release
        run: |
          rm scripts/fix-v071.py .github/workflows/tideland-v071-fixes.yml
          git config user.name 'Roman Svora'
          git config user.email 'roman.svora.ml@gmail.com'
          git add -A
          git commit -m 'Tideland v0.7.1: fix saves, UI toggles and vegetation'
          git push origin HEAD:fix/v071-ui-settings-vegetation
