name: Import latest Tideland

on:
  push:
    paths:
      - '.github/workflows/import-tideland.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch Tideland snapshot
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --filter=blob:none --sparse https://github.com/rsvora-bit/it3b_prog_.git /tmp/school
          printf '%s\n' \
            '/Projekty/Tideland/*' \
            '!/Projekty/Tideland/node_modules/' \
            '!/Projekty/Tideland/node_modules/**' \
            '!/Projekty/Tideland/dist/' \
            '!/Projekty/Tideland/dist/**' \
            '!/Projekty/Tideland/artifacts/' \
            '!/Projekty/Tideland/artifacts/**' \
            '!/Projekty/Tideland/.npm-cache/' \
            '!/Projekty/Tideland/.npm-cache/**' \
            > /tmp/patterns
          git -C /tmp/school sparse-checkout set --no-cone --stdin < /tmp/patterns
          echo "Importing school snapshot $(git -C /tmp/school rev-parse --short HEAD)"

      - name: Replace legacy repository contents
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          rsync -a \
            --exclude='node_modules' \
            --exclude='dist' \
            --exclude='artifacts' \
            --exclude='.npm-cache' \
            --exclude='.npmrc' \
            /tmp/school/Projekty/Tideland/ ./
          test -f package.json
          test -f src/config/version.ts

      - name: Validate imported game
        run: |
          npm ci
          npm test
          npm run build

      - name: Commit clean Tideland repository
        shell: bash
        run: |
          set -euo pipefail
          rm -rf node_modules dist .npm-cache artifacts .npmrc
          git config user.name "Roman Svora"
          git config user.email "roman.svora.ml@gmail.com"
          git add -A
          git commit -m "Replace legacy project with Tideland v0.2.2"
          git push origin main
