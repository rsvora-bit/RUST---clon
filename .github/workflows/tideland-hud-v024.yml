name: Validate Tideland v0.2.4 HUD

on:
  push:
    branches: [feature/hud-overhaul-v024]
    paths:
      - 'scripts/hud-v024.py'
      - '.github/workflows/tideland-hud-v024.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/hud-overhaul-v024
          fetch-depth: 0

      - name: Apply HUD overhaul
        run: |
          sed -i 's/notify_pattern.subn(notify_new,ui,count=1)/notify_pattern.subn(lambda _: notify_new,ui,count=1)/' scripts/hud-v024.py
          sed -i 's/stats_pattern.subn(stats_new,ui,count=1)/stats_pattern.subn(lambda _: stats_new,ui,count=1)/' scripts/hud-v024.py
          sed -i 's/slot_pattern.subn(slot_new,ui,count=1)/slot_pattern.subn(lambda _: slot_new,ui,count=1)/' scripts/hud-v024.py
          python3 scripts/hud-v024.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: HUD browser smoke
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/tideland-preview.log 2>&1 &
          echo $! > /tmp/tideland-preview.pid
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          cat > .hud-smoke.mjs <<'EOF'
          import { chromium } from '@playwright/test';
          const browser=await chromium.launch({headless:true,args:['--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader','--disable-background-timer-throttling','--disable-renderer-backgrounding']});
          const page=await browser.newPage({viewport:{width:1440,height:900}});
          const errors=[];
          page.on('pageerror',e=>errors.push(String(e)));
          page.on('console',msg=>{if(msg.type()==='error')errors.push(msg.text());});
          await page.goto('http://127.0.0.1:4173/',{waitUntil:'domcontentloaded'});
          await page.waitForSelector('.tide-ui',{state:'attached',timeout:20000});
          for(const selector of ['.vitals','.hotbar-wrap','.interaction-prompt','.resource-feedback','.damage-vignette','.hud-craft-queue','.status-pill.wet','.status-pill.cold']) {
            if(await page.locator(selector).count()!==1) throw new Error(`Missing HUD element: ${selector}`);
          }
          const vitalCount=await page.locator('.vital').count();
          if(vitalCount!==3) throw new Error(`Expected 3 vitals, got ${vitalCount}`);
          const slots=await page.locator('.hotbar .item-slot').count();
          if(slots!==6) throw new Error(`Expected 6 hotbar slots, got ${slots}`);
          await page.waitForTimeout(750);
          if(errors.length) throw new Error(`Browser errors: ${errors.join(' | ')}`);
          await browser.close();
          EOF
          node .hud-smoke.mjs
          rm .hud-smoke.mjs
          kill $(cat /tmp/tideland-preview.pid) || true

      - name: Verify release markers
        run: |
          grep -q "GAME_VERSION='0.2.4'" src/config/version.ts
          grep -q "GAME_BUILD='EA-02.4'" src/config/version.ts
          grep -q '"version": "0.2.4"' package.json
          grep -q 'HUD v0.2.4' src/ui/style.css
          grep -q 'resourceHit' src/ui/UI.ts
          grep -q 'hud-craft-queue' src/ui/UI.ts

      - name: Commit validated release
        run: |
          rm scripts/hud-v024.py .github/workflows/tideland-hud-v024.yml
          git config user.name 'Roman Svora'
          git config user.email 'roman.svora.ml@gmail.com'
          git add -A
          git commit -m 'Tideland v0.2.4: survival HUD overhaul'
          git push origin HEAD:feature/hud-overhaul-v024
