name: Validate Tideland v0.4.0 Movement

on:
  push:
    branches: [feature/movement-viewmodel-v040]
    paths:
      - 'scripts/movement-v040-finalize.py'
      - '.github/workflows/tideland-movement-v040.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: feature/movement-viewmodel-v040
          fetch-depth: 0

      - name: Apply final integration
        run: python3 scripts/movement-v040-finalize.py

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Movement and viewmodel browser smoke
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/tideland-preview.log 2>&1 &
          echo $! > /tmp/tideland-preview.pid
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          cat > .movement-smoke.mjs <<'EOF'
          import {chromium} from '@playwright/test';
          const browser=await chromium.launch({headless:true,args:['--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader']});
          const page=await browser.newPage({viewport:{width:1440,height:900}});
          page.setDefaultTimeout(75000);
          const errors=[];
          page.on('pageerror',e=>errors.push(String(e)));
          page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
          await page.goto('http://127.0.0.1:4173/',{waitUntil:'domcontentloaded'});
          await page.waitForFunction(()=>window.__TIDELAND);
          for(const selector of ['[data-keybind="autoRun"]','[data-keybind="inspect"]'])if(await page.locator(selector).count()<1)throw new Error(`Missing ${selector}`);
          await page.evaluate(()=>{document.querySelector('.hero-play')?.click();document.querySelector('[data-action="new"]')?.click();});
          await page.waitForFunction(()=>window.__TIDELAND?.getScreen?.()==='playing');
          const before=await page.evaluate(()=>window.__TIDELAND.snapshot().player.position);
          await page.keyboard.press('CapsLock');
          await page.waitForTimeout(900);
          const movement=await page.evaluate(()=>window.__TIDELAND.cameraDebug());
          const after=await page.evaluate(()=>window.__TIDELAND.snapshot().player.position);
          if(!movement.autoRun)throw new Error('Auto-run did not enable');
          if(Math.hypot(after.x-before.x,after.z-before.z)<.25)throw new Error('Auto-run did not move the player');
          await page.keyboard.press('KeyX');await page.waitForTimeout(80);
          const viewmodel=await page.evaluate(()=>window.__TIDELAND.cameraState().viewmodel);
          if(!(viewmodel.inspect>0))throw new Error('Inspect animation did not start');
          await page.keyboard.down('ShiftLeft');await page.waitForTimeout(700);
          const sprint=await page.evaluate(()=>window.__TIDELAND.cameraState());await page.keyboard.up('ShiftLeft');
          if(!sprint.sprinting)throw new Error('Auto-run + sprint restriction path did not enter sprint');
          if(!(sprint.world.fov>sprint.settings.fov&&sprint.world.fov<sprint.settings.fov+1))throw new Error(`Sprint FOV kick out of range: ${sprint.world.fov}`);
          if(errors.length)throw new Error(`Browser errors: ${errors.join(' | ')}`);
          await browser.close();
          EOF
          node .movement-smoke.mjs
          rm .movement-smoke.mjs
          kill $(cat /tmp/tideland-preview.pid) || true

      - name: Verify release markers
        run: |
          grep -q "GAME_VERSION='0.4.0'" src/config/version.ts
          grep -q "GAME_BUILD='EA-04'" src/config/version.ts
          grep -q '"version": "0.4.0"' package.json
          grep -q "ACCELERATION" src/config/balance.ts
          grep -q "autoRun:'CapsLock'" src/config/balance.ts
          grep -q "inspect:'KeyX'" src/config/balance.ts
          grep -q "footstepSurface" src/app/GameApp.ts
          grep -q "this.held.impact" src/app/GameApp.ts
          grep -q "inspect()" src/rendering/HeldItem.ts

      - name: Commit validated release
        run: |
          rm scripts/movement-v040-finalize.py .github/workflows/tideland-movement-v040.yml
          git config user.name 'Roman Svora'
          git config user.email 'roman.svora.ml@gmail.com'
          git add -A
          git commit -m 'Tideland v0.4.0: movement and first-person animation overhaul'
          git push origin HEAD:feature/movement-viewmodel-v040
