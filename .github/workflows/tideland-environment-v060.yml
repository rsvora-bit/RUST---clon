name: Validate Tideland v0.6.0 Environment

on:
  push:
    branches: [feature/environment-overhaul-v060]
    paths:
      - 'scripts/environment-v060-finalize.py'
      - '.github/workflows/tideland-environment-v060.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: feature/environment-overhaul-v060
          fetch-depth: 0

      - name: Apply environment overhaul
        run: |
          python3 scripts/environment-v060-finalize.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/rendering/environment.ts')
          s=p.read_text()
          s=s.replace("new THREE.MeshLambertMaterial({color:0x526d40,side:THREE.DoubleSide,roughness:1 as never});delete (fernM as unknown as {roughness?:number}).roughness;","new THREE.MeshLambertMaterial({color:0x526d40,side:THREE.DoubleSide});")
          p.write_text(s)
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Verify release markers
        run: |
          grep -q "GAME_VERSION='0.6.0'" src/config/version.ts
          grep -q "GAME_BUILD='EA-06'" src/config/version.ts
          grep -q '"version": "0.6.0"' package.json
          grep -q "class WorldPostFX" src/rendering/WorldPostFX.ts
          grep -q "SSAOPass" src/rendering/WorldPostFX.ts
          grep -q "UnrealBloomPass" src/rendering/WorldPostFX.ts
          grep -q "populateUnderstory" src/rendering/environment.ts
          grep -q "populateGroundDecals" src/rendering/environment.ts
          grep -q "seaweedGeometry" src/world/models.ts
          grep -q "dirtTex" src/world/materials.ts

      - name: Commit validated release
        run: |
          rm scripts/environment-v060-finalize.py .github/workflows/tideland-environment-v060.yml
          git config user.name 'Roman Svora'
          git config user.email 'roman.svora.ml@gmail.com'
          git add -A
          git commit -m 'Tideland v0.6.0: environment graphics overhaul'
          git push origin HEAD:feature/environment-overhaul-v060
