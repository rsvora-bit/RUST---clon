name: Validate Tideland v0.7.2 Fixes

on:
  push:
    branches: [fix/v072-settings-telemetry]
    paths:
      - 'scripts/fix-v072.py'
      - '.github/workflows/tideland-v072-fixes.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: fix/v072-settings-telemetry
          fetch-depth: 0

      - name: Apply v0.7.2 patch
        run: python3 scripts/fix-v072.py

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Verify release markers
        run: |
          grep -q "GAME_VERSION='0.7.2'" src/config/version.ts
          grep -q "GAME_BUILD='EA-07.2'" src/config/version.ts
          grep -q "telemetryScale" src/core/types.ts
          grep -q "telemetryPerformance" src/ui/UI.ts
          grep -q "settings-back-button" src/ui/style.css
          grep -q "telemetry-panel" src/ui/style.css
          grep -q "backFromSettings" src/app/GameApp.ts

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser smoke — settings escape, actions and telemetry
        run: |
          npm run dev -- --port 4177 > /tmp/tideland-v072-vite.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in {1..80}; do curl -fsS http://127.0.0.1:4177/ >/dev/null && break; sleep 0.5; done
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true,args:['--use-angle=swiftshader','--enable-unsafe-swiftshader']});
          const context=await browser.newContext({viewport:{width:1440,height:900}});
          const page=await context.newPage();
          const errors=[];page.on('pageerror',e=>errors.push(String(e)));page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
          await page.goto('http://127.0.0.1:4177/',{waitUntil:'domcontentloaded',timeout:120000});
          await page.waitForSelector('.menu-classic-v7',{state:'visible',timeout:30000});
          await page.locator('.loading-screen').evaluate(el=>{el.hidden=true;});

          await page.click('.menu-classic-v7 [data-action="settings"]');
          await page.waitForSelector('[data-view="settings"]',{state:'visible'});
          const back=page.locator('.settings-back-button');if(await back.count()!==1)throw new Error('Compact settings back control missing');
          const manage=page.locator('[data-view="settings"] [data-action="manageSaves"]');
          const bg=await manage.evaluate(el=>getComputedStyle(el).backgroundColor);if(bg==='rgb(255, 255, 255)')throw new Error('Manage Saves fell back to white browser styling');
          await manage.click();await page.waitForSelector('.save-browser',{state:'visible'});await page.click('[data-action="saveBrowserClose"]');
          await page.click('[data-action="reset"]');await page.waitForSelector('.reset-confirm',{state:'visible'});await page.click('[data-action="resetCancel"]');

          const scale=page.locator('input[data-setting="telemetryScale"]');if(await scale.count()!==1)throw new Error('Telemetry scale control missing');
          await scale.evaluate(el=>{el.value='1.2';el.dispatchEvent(new Event('input',{bubbles:true}));});
          const cameraOn=page.locator('[data-toggle="telemetryCamera"][data-value="true"]');await cameraOn.click();if(!(await cameraOn.evaluate(el=>el.classList.contains('active'))))throw new Error('Telemetry camera toggle did not activate');

          await page.keyboard.press('Escape');await page.waitForSelector('.menu-classic-v7',{state:'visible',timeout:10000});
          await page.keyboard.press('F3');await page.waitForSelector('.telemetry-panel',{state:'visible',timeout:10000});
          if(await page.locator('[data-telemetry-section="performance"]').count()!==1)throw new Error('Performance telemetry section missing');
          if(await page.locator('[data-telemetry-section="camera"]').count()!==1)throw new Error('Camera telemetry section missing');
          await page.click('[data-action="telemetryClose"]');await page.waitForSelector('.telemetry-panel',{state:'hidden'});
          if(errors.length)throw new Error(errors.join('\n'));
          await browser.close();
          NODE

      - name: Commit validated release
        run: |
          rm scripts/fix-v072.py .github/workflows/tideland-v072-fixes.yml
          git config user.name 'Roman Svora'
          git config user.email 'roman.svora.ml@gmail.com'
          git add -A
          git commit -m 'Tideland v0.7.2: settings navigation and telemetry polish'
          git push origin HEAD:fix/v072-settings-telemetry
