name: Validate Tideland v0.3.0 Menu

on:
  push:
    branches: [feature/menu-settings-i18n-v030]
    paths:
      - 'scripts/menu-v030.py'
      - '.github/workflows/tideland-menu-v030.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: feature/menu-settings-i18n-v030
          fetch-depth: 0

      - name: Apply menu/settings update
        run: python3 scripts/menu-v030.py

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Menu browser smoke
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/tideland-preview.log 2>&1 &
          echo $! > /tmp/tideland-preview.pid
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          cat > .menu-smoke.mjs <<'EOF'
          import {chromium} from '@playwright/test';
          const browser=await chromium.launch({headless:true,args:['--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader']});
          const page=await browser.newPage({viewport:{width:1440,height:900}});
          const errors=[];page.on('pageerror',e=>errors.push(String(e)));page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
          await page.goto('http://127.0.0.1:4173/',{waitUntil:'domcontentloaded'});await page.waitForSelector('.tide-ui',{state:'attached',timeout:20000});
          for(const selector of ['.menu-v3','.hero-play','.play-panel','.settings-v3','[data-settings-tab="gameplay"]','[data-settings-tab="controls"]','[data-settings-tab="graphics"]','[data-settings-tab="audio"]','[data-keybind="forward"]','[data-preset="ultra"]','.new-game-confirm','[data-language="cs"]'])if(await page.locator(selector).count()<1)throw new Error(`Missing ${selector}`);
          await page.locator('[data-language="cs"]').first().click({force:true});
          if((await page.locator('.hero-play span').textContent())?.trim()!=='HRÁT')throw new Error('Czech language switch failed');
          await page.locator('[data-action="settings"]').first().click({force:true});
          await page.locator('[data-settings-tab="controls"]').click({force:true});
          if(!await page.locator('[data-settings-page="controls"]').evaluate(el=>el.classList.contains('active')))throw new Error('Controls tab did not activate');
          const bind=page.locator('[data-keybind="forward"]');await bind.click({force:true});await bind.press('KeyP');
          if((await bind.textContent())?.trim()!=='P')throw new Error('Keybind remap failed');
          await page.locator('[data-settings-tab="graphics"]').click({force:true});await page.locator('[data-preset="ultra"]').click({force:true});
          if(!await page.locator('[data-preset="ultra"]').evaluate(el=>el.classList.contains('active')))throw new Error('Ultra preset failed');
          const stored=await page.evaluate(()=>JSON.parse(localStorage.getItem('tideland-settings')||'{}'));
          if(stored.language!=='cs'||stored.keybinds?.forward!=='KeyP'||stored.quality!=='ultra')throw new Error(`Settings persistence failed: ${JSON.stringify(stored)}`);
          if(errors.length)throw new Error(`Browser errors: ${errors.join(' | ')}`);await browser.close();
          EOF
          node .menu-smoke.mjs
          rm .menu-smoke.mjs
          kill $(cat /tmp/tideland-preview.pid) || true

      - name: Verify release markers
        run: |
          grep -q "GAME_VERSION='0.3.0'" src/config/version.ts
          grep -q "GAME_BUILD='EA-03'" src/config/version.ts
          grep -q '"version": "0.3.0"' package.json
          grep -q "sensitivityX" src/core/types.ts
          grep -q "musicVolume" src/core/types.ts
          grep -q "data-settings-tab=\"graphics\"" src/ui/UI.ts
          grep -q "data-language=\"cs\"" src/ui/UI.ts
          grep -q "cameraShake" src/app/GameApp.ts

      - name: Commit validated release
        run: |
          rm scripts/menu-v030.py .github/workflows/tideland-menu-v030.yml
          git config user.name 'Roman Svora'
          git config user.email 'roman.svora.ml@gmail.com'
          git add -A
          git commit -m 'Tideland v0.3.0: game menu settings and Czech localization'
          git push origin HEAD:feature/menu-settings-i18n-v030
