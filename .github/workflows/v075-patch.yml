name: Apply and validate Tideland v0.7.5

on:
  push:
    branches:
      - feature/v075-world-shape-ui
    paths:
      - scripts/apply-v075.py
      - .github/workflows/v075-patch.yml

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/v075-world-shape-ui
          fetch-depth: 0
      - name: Apply patch
        run: |
          python3 scripts/apply-v075.py
          python3 - <<'PY'
          from pathlib import Path

          p=Path('tests/terrain-generation.test.ts')
          s=p.read_text()
          old='expect(state.worldGeneration).toBe(3);expect(validateGameState(state)).toBe(true);'
          new='expect(state.worldGeneration).toBe(4);expect(validateGameState(state)).toBe(true);expect(validateGameState({...state,worldGeneration:3})).toBe(true);'
          if old not in s: raise SystemExit('missing terrain generation expectation anchor')
          p.write_text(s.replace(old,new,1))

          p=Path('tests/v074-world-variety.test.ts')
          s=p.read_text()
          old="it('accepts generation 3 save snapshots',()=>{\n    const sim=new GameSimulation(99,{x:0,y:5,z:0});expect(sim.state.worldGeneration).toBe(3);expect(validateGameState(sim.state)).toBe(true);\n  });"
          new="it('accepts generation 3 save snapshots while new worlds use generation 4',()=>{\n    const sim=new GameSimulation(99,{x:0,y:5,z:0});expect(sim.state.worldGeneration).toBe(4);expect(validateGameState(sim.state)).toBe(true);expect(validateGameState({...sim.state,worldGeneration:3})).toBe(true);\n  });"
          if old not in s: raise SystemExit('missing v0.7.4 generation compatibility test anchor')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Verify v0.7.5 markers
        run: |
          grep -q "GAME_VERSION='0.7.5'" src/config/version.ts
          grep -q "GAME_BUILD='EA-07.5'" src/config/version.ts
          grep -q "worldGeneration: 4" src/simulation/GameSimulation.ts
          grep -q "expandedHeight" src/terrain/island.ts
          grep -q "buildHorizon" src/world/atmosphere.ts
          grep -q "resource-target" src/ui/style.css
          grep -q "setDevModes" src/ui/UI.ts
          grep -q "Metal Ore" src/config/gameplay.ts
      - name: Commit validated patch
        run: |
          rm -f scripts/apply-v075.py .github/workflows/v075-patch.yml
          git config user.name "Roman Svora"
          git config user.email "roman.svora.ml@gmail.com"
          git add -A
          git commit -m "Tideland v0.7.5: expanded island and cleaner resource HUD"
          git push origin HEAD:feature/v075-world-shape-ui
