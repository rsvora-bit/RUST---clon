name: Apply and validate Tideland v0.7.4

on:
  push:
    branches:
      - feature/v074-world-variety
    paths:
      - scripts/apply-v074.py
      - .github/workflows/v074-patch.yml

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/v074-world-variety
          fetch-depth: 0
      - name: Apply patch
        run: |
          python3 scripts/apply-v074.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/simulation/GameSimulation.ts')
          s=p.read_text()
          old='version: 1, worldGeneration: 2, seed, elapsed: 0, timeOfDay: SURVIVAL.START_HOUR,'
          new='version: 1, worldGeneration: 3, seed, elapsed: 0, timeOfDay: SURVIVAL.START_HOUR,'
          if old not in s: raise SystemExit('missing GameSimulation worldGeneration anchor')
          p.write_text(s.replace(old,new,1))
          p=Path('tests/terrain-generation.test.ts')
          s=p.read_text()
          old='expect(state.worldGeneration).toBe(2);expect(validateGameState(state)).toBe(true);'
          new='expect(state.worldGeneration).toBe(3);expect(validateGameState(state)).toBe(true);'
          if old not in s: raise SystemExit('missing terrain generation test anchor')
          p.write_text(s.replace(old,new,1))
          Path('tests/v074-world-variety.test.ts').write_text("""import {describe,expect,it} from 'vitest';
          import {IslandTerrain} from '../src/terrain/island';
          import {GATHERING} from '../src/config/gameplay';
          import {ITEMS} from '../src/items/definitions';
          import {validateGameState} from '../src/save/storage';
          import {GameSimulation} from '../src/simulation/GameSimulation';

          describe('v0.7.4 seeded world variety',()=>{
            it('keeps generation 2 spawn stable but gives generation 3 seed-dependent spawn',()=>{
              const oldWorld=new IslandTerrain(731942,2),a=new IslandTerrain(731942,3),a2=new IslandTerrain(731942,3),b=new IslandTerrain(123456,3);
              expect({x:oldWorld.spawn.x,z:oldWorld.spawn.z}).toEqual({x:28,z:212});
              expect({x:a.spawn.x,z:a.spawn.z}).toEqual({x:a2.spawn.x,z:a2.spawn.z});
              expect(Math.hypot(a.spawn.x-b.spawn.x,a.spawn.z-b.spawn.z)).toBeGreaterThan(5);
              expect(a.spawn.y).toBeGreaterThan(2);
            });
            it('ships sulfur and high quality metal as gatherable resources',()=>{
              expect(GATHERING.sulfur.itemId).toBe('sulfurOre');expect(GATHERING.hqmetal.itemId).toBe('hqMetalOre');
              expect(ITEMS.sulfurOre.displayName).toBe('Sulfur ore');expect(ITEMS.hqMetalOre.displayName).toContain('High quality');
            });
            it('accepts generation 3 save snapshots',()=>{
              const sim=new GameSimulation(99,{x:0,y:5,z:0});expect(sim.state.worldGeneration).toBe(3);expect(validateGameState(sim.state)).toBe(true);
            });
          });
          """)
          PY
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Verify v0.7.4 markers
        run: |
          grep -q "GAME_VERSION='0.7.4'" src/config/version.ts
          grep -q "GAME_BUILD='EA-07.4'" src/config/version.ts
          grep -q 'new MessageChannel()' src/app/GameApp.ts
          grep -q "worldGeneration: 3" src/simulation/GameSimulation.ts
          grep -q 'Collapsed relay site' src/survival/WorldSurvival.ts
          grep -q 'loot-field-' src/survival/WorldSurvival.ts
          grep -q 'hqMetalOre' src/items/definitions.ts
          grep -q 'sulfurOre' src/items/definitions.ts
          grep -q '← BACK' src/ui/UI.ts
          grep -q "this.find('.history-panel').hidden = true" src/ui/UI.ts
      - name: Commit validated patch
        run: |
          rm -f scripts/apply-v074.py .github/workflows/v074-patch.yml
          git config user.name "Roman Svora"
          git config user.email "roman.svora.ml@gmail.com"
          git add -A
          git commit -m "Tideland v0.7.4: world variety, loot and dev tools"
          git push origin HEAD:feature/v074-world-variety
